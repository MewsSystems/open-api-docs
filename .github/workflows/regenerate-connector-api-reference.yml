name: Regenerate Connector API reference

on:
  schedule:
    - cron: '0 12 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate-connector-api-reference

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false keeps the contents:write token out of .git/config, where the
      # changelog agent would otherwise be able to read it. create-pull-request pushes with its own
      # token input, so it does not need the persisted credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version-file: connector-api/_generator/.nvmrc
          cache: npm
          cache-dependency-path: connector-api/_generator/package-lock.json

      - name: Install generator dependencies
        working-directory: connector-api/_generator
        run: npm ci

      - name: Regenerate reference documentation
        working-directory: connector-api/_generator
        run: node index.js

      # Staging serves two purposes: the changelog skill's detect script reads `git diff --cached`
      # first, and `git diff` alone would not see a brand-new operations page (the generator writes
      # one per OpenAPI tag, and `config.yaml` filters no tags).
      #
      # The gate excludes `_generator/` because `index.js` rewrites `_generator/types.yaml` on every
      # run. Without the exclusion, a types-cache-only run would produce a pointless PR and burn an
      # agent invocation. A types-only change instead waits and rides along with the next real one.
      - name: Stage regenerated reference
        id: stage
        run: |
          git add -A -- connector-api/
          if git diff --cached --quiet -- connector-api/ ':(exclude)connector-api/_generator/'; then
            echo 'No reference changes — skipping changelog and pull request.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # The skill decides whether an entry is needed at all (functional changes require one,
      # documentation-only changes do not) and updates connector-api/changelog/README.md, plus
      # connector-api/deprecations/README.md when deprecations are involved.
      #
      # Credentials: MOXLY_LITELLM_BASE_URL / MOXLY_LITELLM_API_KEY are org-level and surface into any
      # workflow that references them by name, so this repository needs no secret of its own. The key
      # must go in `with:`, not `env:` — the action hardcodes ANTHROPIC_API_KEY from its own input.
      #
      # This repository is public, and the diff the agent reads originates from a network-fetched
      # OpenAPI specification, so the prompt-injection surface is real even though no fork-authored
      # content can reach this workflow (schedule and workflow_dispatch only). The mitigation is to
      # deny egress: no github_token is passed, the allowlist carries no WebFetch/WebSearch/gh/git,
      # and --strict-mcp-config with no --mcp-config guarantees no MCP server is spawned.
      # GITHUB_ACTIONS is falsified so claude-code-action cannot attach a GitHub MCP surface by some
      # route --strict-mcp-config does not cover.
      #
      # Edit is scoped to the two files the prompt authorises. Unscoped, it would reach the detect
      # script itself — the one command this step may also execute — so the agent could rewrite that
      # script and invoke it under the allowlisted prefix, turning a deliberately narrow Bash grant
      # into arbitrary shell next to a live gateway key. Scoping also makes "edit the tables in place
      # only" a permission rather than a request.
      #
      # The detect script is granted twice, bare and `node`-prefixed. The skill pins the bare form and
      # the file is executable, but a .mjs path is a strong attractor for a `node ` prefix, and a
      # denied first attempt in an unattended weekly job is worth the extra entry. Node itself comes
      # from the setup-node step above.
      - name: Draft changelog entry
        id: changelog
        if: steps.stage.outputs.changed == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@593d7a5c4e0073569f74772c2b7b64c30ec14707 #v1
        env:
          ANTHROPIC_BASE_URL: ${{ vars.MOXLY_LITELLM_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: |
            x-litellm-end-user-id: ${{ github.actor }}
            x-litellm-tags: trigger=regenerate-connector-api-reference,repository=${{ github.repository }},workflow=${{ github.workflow }},run_id=${{ github.run_id }}
          GITHUB_ACTIONS: false
        with:
          anthropic_api_key: ${{ secrets.MOXLY_LITELLM_API_KEY }}
          # Folded, not literal: the whole prompt must reach the CLI as a single line so the trailing
          # text is taken as the slash command's argument rather than as a separate message.
          prompt: >-
            /connector-api-changelog-entry The Connector API reference was just regenerated in this
            working tree and the changes are staged — collect them with the skill's detect script. A
            full regeneration diff can exceed the output limit, and a truncated diff looks exactly
            like a complete one, so list the changed files with --no-diff first and then request them
            one at a time with --path rather than asking for the whole diff at once. Date the entry
            tomorrow rather than today, so it is not already in the past when this pull request is
            reviewed. Edit the changelog and deprecations tables in place only; do not stage, commit,
            push, or open a pull request, as a later workflow step does that. If the diff is
            documentation-only, change nothing and say so.
          claude_args: |
            --model claude-opus-5
            --max-turns 40
            --strict-mcp-config
            --allowedTools "Skill,Read,Grep,Glob,Edit(connector-api/changelog/README.md),Edit(connector-api/deprecations/README.md),Bash(.claude/skills/connector-api-changelog-entry/scripts/detect-changed-connector-api-files.mjs:*),Bash(node .claude/skills/connector-api-changelog-entry/scripts/detect-changed-connector-api-files.mjs:*)"

      - name: Create pull request
        if: steps.stage.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 #v8.1.1
        with:
          branch: chore/regenerate-connector-api-reference
          # Nothing outside connector-api/ is ever a legitimate product of this workflow, so an edit
          # elsewhere cannot ride into the commit.
          add-paths: connector-api/**
          commit-message: 'docs: regenerate Connector API reference'
          title: 'docs: regenerate Connector API reference'
          labels: changelog-automatic
          body: |
            ## Summary

            Automated regeneration of the Connector API reference from the [demo OpenAPI specification](https://api.mews-demo.com/swagger/connector/swagger.yaml), produced by [`connector-api/_generator`](https://github.com/MewsSystems/open-api-docs/tree/main/connector-api/_generator) in [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            The demo environment can be ahead of production. Confirm the documented changes are released before merging.

            ${{ steps.changelog.outcome == 'success' && 'An agent drafted the changelog entry in this run, or judged that none was needed — verify that decision rather than assuming it.' || format('⚠️ **The changelog agent did not complete (outcome: `{0}`), so no entry was drafted. Write it by hand.**', steps.changelog.outcome) }} An entry in `connector-api/changelog/README.md` is required only if this diff contains functional changes — new or removed operations or properties, or changes to requiredness, types, enum values, or limits. Documentation-only changes do not need one. Drafted entries are dated one day ahead, so check the date still makes sense if this sits unmerged.

            > [!WARNING]
            > This branch is force-pushed on every run. Commits pushed to it will be lost.

            ## Checklist

            - [ ] Documentation follows the [contribution guidelines](https://github.com/MewsSystems/open-api-docs/blob/main/CONTRIBUTING.md)
            - [ ] Changelog accurately describes all changes, or the diff is documentation-only
            - [ ] All hyperlinks tested
            - [ ] `SUMMARY.md` updated if new pages added

            ### API

            - [ ] Changelog highlights the affected endpoints or operations
            - [ ] Changelog highlights any deprecations
            - [ ] Deprecation Table updated if any deprecations
